name: Go panel validation and build
on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: go-panel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.2
        env:
          MYSQL_ROOT_PASSWORD: isolated-go-test-only
          MYSQL_DATABASE: flux_go_test_ci
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      GOTOOLCHAIN: local
      FLUX_TEST_DSN: root:isolated-go-test-only@tcp(127.0.0.1:3306)/flux_go_test_ci
      FLUX_TEST_SCHEMA_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: panel-go/go.sum
      - run: go -C panel-go mod download
      - run: python3 panel-go/tests/inventory.py --check
      - run: python3 panel-go/tests/go-only.py
      - run: go -C panel-go test -race -count=1 ./...
      - run: go -C panel-go vet ./...
      - run: panel-go/packaging/build.sh "$RUNNER_TEMP/panel-release"
      - uses: actions/upload-artifact@v4
        with:
          name: go-panel-linux
          path: ${{ runner.temp }}/panel-release
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vite-frontend/package-lock.json
      - run: npm ci
        working-directory: vite-frontend
      - run: npm run build
        working-directory: vite-frontend
      - run: docker build -f panel-go/Dockerfile -t flux-panel-go:ci .
      - run: docker build -t flux-panel-frontend:ci vite-frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: vite-frontend/dist
  node-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: node-agent/go.sum
      - run: go -C node-agent test ./...
      - name: Validate timeout encoding with the real nft parser in an isolated namespace
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nftables
          go -C node-agent test -c -o "$RUNNER_TEMP/flux-engine.test" ./internal/engine
          sudo env FLUX_NFT_PARSER_TEST=1 "$RUNNER_TEMP/flux-engine.test" -test.run '^TestNFTTimeoutParserCompatibility$' -test.v
  gost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache-dependency-path: go-gost/go.sum
      - run: go -C go-gost mod download
      - name: Build retained GOST binaries
        run: |
          mkdir -p "$RUNNER_TEMP/gost"
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go -C go-gost build -trimpath -buildvcs=false -ldflags='-s -w' -o "$RUNNER_TEMP/gost/gost-linux-$arch" .
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gost-linux
          path: ${{ runner.temp }}/gost
# CI builds and uploads artifacts only. No image publication, release creation,
# branch mutation or deployment is triggered by pushing these development branches.
