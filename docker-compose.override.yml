services:
  mysql:
    profiles: ["disabled"]
  backend:
    container_name: flux-panel-backend-1
    networks:
      - gost-network
      - infra_net
    environment:
      TZ: Asia/Singapore
      JAVA_OPTS: "-Xms256m -Xmx512m -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Singapore"
    depends_on: !reset []
  frontend:
    container_name: flux-panel-frontend-1
    environment:
      TZ: Asia/Singapore
networks:
  infra_net:
    external: true
