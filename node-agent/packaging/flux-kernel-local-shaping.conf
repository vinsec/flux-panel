# Optional: prepare bpffs and loopback prerequisites before enabling this.
# Overwrite the old v5.1 drop-in; daemon-reload and restart the helper.
[Unit]
Requires=flux-local-shaping-prepare.service
After=flux-local-shaping-prepare.service
[Service]
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE
AmbientCapabilities=
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE
ReadOnlyPaths=/sys/fs/bpf /run/flux-agent-bpf
